resources:
  jobs:
    pipeline_anime_elt:
      name: pipeline_anime_elt
      trigger:
        pause_status: PAUSED
        periodic:
          interval: 1
          unit: HOURS
      tasks:
        - task_key: run_pipeline_animes
          notebook_task:
            notebook_path: /Workspace/Users/estevaolins94@gmail.com/animes_databricks_pipeline/anime_elt
            source: WORKSPACE
          timeout_seconds: 1800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 1320
          email_notifications:
            on_start:
              - estevaolins94@gmail.com
            on_success:
              - estevaolins94@gmail.com
            on_failure:
              - estevaolins94@gmail.com
          notification_settings:
            alert_on_last_attempt: true
      git_source:
        git_url: https://github.com/ttstive/animes_databricks_pipeline.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
